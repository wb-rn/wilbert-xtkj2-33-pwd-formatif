<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Kontak - Wilbert</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f1f5f9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
        }

        /* Pengaturan bagian kontak dengan ID #contact */
        #contact {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        /* Judul h2 di dalam form */
        .contact-form h2 {
            text-align: center;
            color: #1e293b;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* Jarak antar form-group */
        .form-group {
            margin-bottom: 20px;
        }

        /* Label dengan selector descendant */
        .form-group label {
            display: block;
            font-weight: bold;
            color: #334155;
            margin-bottom: 8px;
            font-size: 14px;
        }

        /* Kotak input dan textarea (Grouping dan Descendant) */
        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            color: #1e293b;
            background-color: #f8fafc;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        /* Efek saat kotak isian diklik (Pseudo-class :focus) */
        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Tombol Kirim Pesan */
        .btn-submit {
            display: block;
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        /* Tautan kembali ke beranda */
        footer {
            text-align: center;
            margin-top: 30px;
        }

        footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main>
        <!-- Bagian Kontak -->
        <section id="contact">
            <form class="contact-form">
                <h2>Hubungi Saya</h2>

                <!-- Input Nama -->
                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap...">
                </div>

                <!-- Input Email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan alamat email...">
                </div>

                <!-- Input Pesan -->
                <div class="form-group">
                    <label for="pesan">Pesan</label>
                    <textarea id="pesan" name="pesan" placeholder="Tuliskan pesan atau pertanyaanmu di sini..."></textarea>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" class="btn-submit">Kirim Pesan</button>
            </form>
        </section>
    </main>

    <!-- Tautan kembali ke beranda -->
    <footer>
        <a href="../index.html">&larr; Kembali ke Beranda</a>
    </footer>

</body>
</html>
