<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Tombol Transisi Halus - Wilbert</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background-color: #f8fafc;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px;
        text-align: center;
      }

      .container {
        max-width: 500px;
        margin: 0 auto;
        background: #ffffff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        border: 1px solid #cbd5e1;
      }

      h2 {
        color: #1e293b;
        font-size: 22px;
        margin-bottom: 25px;
      }

      /* Tombol dasar dengan transisi halus */
      .btn {
        display: inline-block;
        background-color: #2563eb;
        color: white;
        padding: 12px 28px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
        font-size: 15px;
        margin-bottom: 20px;
        /* Properti transition untuk membuat efek bergerak halus */
        transition:
          background-color 0.3s ease,
          transform 0.2s ease,
          box-shadow 0.3s ease;
      }

      /* Efek saat kursor menyentuh tombol pertama */
      .btn:hover {
        background-color: #1d4ed8;
        transform: translateY(-3px);
        box-shadow: 0 6px 12px rgba(37, 99, 235, 0.2);
      }

      /* Footer dan tautan kembali */
      footer {
        text-align: center;
        margin-top: 30px;
      }

      footer a {
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="container">
        <h2>Efek Transisi Halus pada Tombol</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 20px">
          Arahkan kursor ke tombol di bawah untuk melihat perubahan warna dan
          posisi yang bergerak halus.
        </p>

        <!-- Tombol Interaktif -->
        <a href="#" class="btn">Tekan Saya</a>
      </div>
    </main>

    <footer>
      <a href="../index.html">&larr; Kembali ke Beranda</a>
    </footer>
  </body>
</html>
