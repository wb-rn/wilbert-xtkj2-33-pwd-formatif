<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Kartu Proyek - Wilbert</title>
    <style>
      /* Selector universal (*) untuk mengatur box-sizing border-box */
      * {
        box-sizing: border-box;
      }

      body {
        background-color: #f8fafc;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px;
      }

      /* Pengaturan kartu proyek */
      .card {
        width: 320px;
        padding: 20px;
        border: 2px solid #cbd5e1;
        border-radius: 8px;
        margin: 30px auto;
        background-color: #ffffff;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }

      /* Gambar di dalam kartu */
      .card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 4px;
        display: block;
      }

      /* Judul proyek */
      .card h3 {
        color: #1e293b;
        font-size: 18px;
        margin: 15px 0 10px 0;
      }

      /* Paragraf dan tautan di dalam kartu */
      .card p {
        font-size: 14px;
        color: #475569;
        line-height: 1.5;
        margin-bottom: 15px;
      }

      .card a {
        display: inline-block;
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
      }

      .card a:hover {
        text-decoration: underline;
      }

      /* Footer halaman */
      footer {
        text-align: center;
        margin-top: 20px;
      }

      footer a {
        color: #0056b3;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Kartu Proyek -->
      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=500&auto=format&fit=crop&q=60"
          alt="Gambar Proyek"
        />
        <h3>Website Jaringan Komputer</h3>
        <p>
          Proyek latihan membuat tata letak halaman web responsif menggunakan
          HTML dan CSS dasar.
        </p>
        <a href="#">Lihat Proyek &rarr;</a>
      </div>
    </main>

    <!-- Tautan kembali ke beranda -->
    <footer>
      <a href="../index.html">&larr; Kembali ke Beranda</a>
    </footer>
  </body>
</html>
