<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Kartu Animasi - Wilbert</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background-color: #f1f5f9;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px;
        text-align: center;
      }

      /* Aturan Keyframes untuk animasi berdenyut */
      @keyframes pulse {
        0% {
          transform: scale(1);
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        50% {
          transform: scale(1.03);
          box-shadow: 0 10px 20px rgba(37, 99, 235, 0.15);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
      }

      /* Kartu dengan animasi yang berjalan terus-menerus */
      .animated-card {
        width: 340px;
        background: #ffffff;
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        margin: 30px auto;
        /* Memanggil animasi pulse selama 2 detik secara berulang (infinite) */
        animation: pulse 2s infinite ease-in-out;
      }

      .animated-card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 6px;
        display: block;
      }

      .animated-card h3 {
        color: #1e293b;
        font-size: 18px;
        margin: 15px 0 10px 0;
      }

      .animated-card p {
        color: #475569;
        font-size: 14px;
        line-height: 1.5;
        margin: 0;
      }

      footer {
        text-align: center;
        margin-top: 30px;
      }

      footer a {
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h2 style="color: #1e293b; margin-bottom: 10px">
        Efek Animasi Berdenyut
      </h2>
      <p style="color: #64748b; font-size: 14px; margin-bottom: 30px">
        Kartu di bawah ini menggunakan aturan <code>@keyframes</code> sehingga
        berdenyut secara otomatis.
      </p>

      <!-- Kartu dengan Animasi -->
      <div class="animated-card">
        <img
          src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=500&auto=format&fit=crop&q=60"
          alt="Proyek Animasi"
        />
        <h3>Proyek Unggulan</h3>
        <p>
          Kartu ini bergerak membesar dan mengecil secara halus menggunakan
          animasi CSS Keyframes.
        </p>
      </div>
    </main>

    <footer>
      <a href="../index.html">&larr; Kembali ke Beranda</a>
    </footer>
  </body>
</html>
